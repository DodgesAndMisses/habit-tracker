<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>◯ Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --red: #e63232;
    --red-dim: #7a1a1a;
    --text: #f0f0f0;
    --text-dim: #555;
    --text-mid: #888;
    --done: #e63232;
    --empty: #1e1e1e;
    --empty-border: #333;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    /* iOS safe area */
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .nav-logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--red);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .nav-tab {
    padding: 6px 16px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-mid);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-tab.active { background: var(--red); color: #fff; }
  .nav-week { font-size: 11px; color: var(--text-dim); font-family: 'Space Mono', monospace; }

  /* PAGES */
  .page { display: none; padding: 20px; max-width: 700px; margin: 0 auto; padding-bottom: 40px; }
  .page.active { display: block; }

  /* TRACKER PAGE */
  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .week-title { font-size: 11px; color: var(--text-dim); font-family: 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
  .week-nav { display: flex; gap: 8px; align-items: center; }
  .week-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s;
  }
  .week-nav button:active { border-color: var(--red); }
  .week-label { font-size: 11px; color: var(--text-mid); font-family: 'Space Mono', monospace; min-width: 110px; text-align: center; }

  /* DAY LABELS */
  .day-labels {
    display: grid;
    grid-template-columns: 1fr repeat(7, 34px) 34px;
    gap: 5px;
    margin-bottom: 6px;
    padding: 0 2px;
  }
  .day-label {
    text-align: center;
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* TASK ROW */
  .tasks-list { display: flex; flex-direction: column; gap: 6px; }
  .task-row {
    display: grid;
    grid-template-columns: 1fr repeat(7, 34px) 34px;
    gap: 5px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 10px;
    transition: border-color 0.2s;
  }
  .task-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 4px;
  }
  .task-name-input {
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--red);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
    width: 100%;
    padding: 2px 0;
  }

  /* CIRCLES */
  .circle-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--empty-border);
    background: var(--empty);
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .circle-btn:active { transform: scale(0.9); }
  .circle-btn.done {
    background: var(--done);
    border-color: var(--done);
  }
  .circle-btn.done::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.2), transparent 60%);
  }

  /* DELETE */
  .task-delete {
    width: 34px; height: 34px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .task-delete:active { color: var(--red); }

  /* ADD TASK */
  .add-task-btn {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .add-task-btn:active { border-color: var(--red); color: var(--red); }

  /* INSTALL BANNER */
  #installBanner {
    display: none;
    margin: 0 20px 16px;
    background: var(--surface);
    border: 1px solid var(--red-dim);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-mid);
    align-items: center;
    gap: 10px;
  }
  #installBanner.show { display: flex; }
  #installBanner strong { color: var(--text); }
  #installBanner button {
    margin-left: auto;
    background: var(--red);
    border: none;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  #dismissBanner {
    background: transparent !important;
    color: var(--text-dim) !important;
    padding: 6px 4px !important;
    font-size: 16px !important;
  }

  /* STATS PAGE */
  .stats-title { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-number { font-size: 28px; font-weight: 700; color: var(--red); font-family: 'Space Mono', monospace; }
  .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .section-label { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; margin-top: 24px; }
  .task-stat-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 7px; display: flex; align-items: center; gap: 12px; }
  .task-stat-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-stat-count { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .progress-bar-wrap { flex: 2; height: 5px; background: var(--empty); border-radius: 3px; overflow: hidden; min-width: 40px; }
  .progress-bar { height: 100%; background: var(--red); border-radius: 3px; }
  .week-history { display: flex; flex-direction: column; gap: 8px; }
  .week-hist-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .hist-week-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); min-width: 72px; }
  .hist-dots { display: flex; gap: 4px; flex: 1; }
  .hist-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--empty); border: 1.5px solid var(--empty-border); flex-shrink: 0; }
  .hist-dot.done { background: var(--red); border-color: var(--red); }
  .hist-pct { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-mid); min-width: 32px; text-align: right; }
  .empty-stats { text-align: center; padding: 32px; color: var(--text-dim); font-size: 13px; border: 1px dashed var(--border); border-radius: 12px; }

  /* Today highlight */
  .day-label.today { color: var(--red); }
  .circle-btn.today-col { border-color: #4a1010; }

  @media (max-width: 400px) {
    .day-labels, .task-row {
      grid-template-columns: 1fr repeat(7, 30px) 30px;
      gap: 3px;
    }
    .circle-btn { width: 30px; height: 30px; }
    .task-delete { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<nav>
  <span class="nav-logo">◯ tracker</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('tracker')">Week</button>
    <button class="nav-tab" onclick="showPage('stats')">Stats</button>
  </div>
  <span class="nav-week" id="navWeek"></span>
</nav>

<!-- iOS install hint -->
<div id="installBanner">
  <span>📲 <strong>Add to Home Screen</strong> — tap the Share button in Safari, then "Add to Home Screen"</span>
  <button id="dismissBanner" onclick="dismissInstall()">×</button>
</div>

<!-- TRACKER PAGE -->
<div class="page active" id="page-tracker">
  <div class="week-header">
    <span class="week-title">Weekly Habits</span>
    <div class="week-nav">
      <button onclick="changeWeek(-1)">‹</button>
      <span class="week-label" id="weekLabel"></span>
      <button onclick="changeWeek(1)">›</button>
    </div>
  </div>
  <div class="day-labels" id="dayLabels">
    <div></div>
    <div class="day-label">M</div>
    <div class="day-label">T</div>
    <div class="day-label">W</div>
    <div class="day-label">T</div>
    <div class="day-label">F</div>
    <div class="day-label">S</div>
    <div class="day-label">S</div>
    <div></div>
  </div>
  <div class="tasks-list" id="tasksList"></div>
  <button class="add-task-btn" onclick="addTask()">
    <span style="font-size:18px;line-height:1">+</span> Add habit
  </button>
</div>

<!-- STATS PAGE -->
<div class="page" id="page-stats">
  <div class="stats-title">Statistics</div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-label">By habit</div>
  <div id="taskStatsSection"></div>
  <div class="section-label">Week history</div>
  <div class="week-history" id="weekHistory"></div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'habittracker_v1';
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState(); }
  catch { return defaultState(); }
}
function defaultState() {
  return {
    tasks: [
      { id: 't1', name: 'Morning run' },
      { id: 't2', name: 'Read 30 min' },
      { id: 't3', name: 'No sugar' },
    ],
    weeks: {},
  };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();
let currentWeekOffset = 0;

// ─── WEEK UTILS ──────────────────────────────────────────────────────────────
function getWeekKey(offset = 0) {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + offset * 7);
  return monday.toISOString().slice(0, 10);
}
function getWeekLabel(offset = 0) {
  const key = getWeekKey(offset);
  const start = new Date(key);
  const end = new Date(key); end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
  return `${fmt(start)} – ${fmt(end)}`;
}
function getWeekData(weekKey) {
  if (!state.weeks[weekKey]) state.weeks[weekKey] = {};
  return state.weeks[weekKey];
}
function getTaskDays(weekKey, taskId) {
  const w = getWeekData(weekKey);
  if (!w[taskId]) w[taskId] = [false,false,false,false,false,false,false];
  return w[taskId];
}
function todayDayIndex() {
  // Mon=0 … Sun=6
  return (new Date().getDay() + 6) % 7;
}

// ─── RENDER TRACKER ──────────────────────────────────────────────────────────
function renderTracker() {
  const weekKey = getWeekKey(currentWeekOffset);
  document.getElementById('weekLabel').textContent = getWeekLabel(currentWeekOffset);
  document.getElementById('navWeek').textContent = currentWeekOffset === 0 ? 'this week' : currentWeekOffset < 0 ? `${Math.abs(currentWeekOffset)}w ago` : `+${currentWeekOffset}w`;

  const todayIdx = currentWeekOffset === 0 ? todayDayIndex() : -1;

  // Update day label highlights
  const dayLabelEls = document.querySelectorAll('#dayLabels .day-label');
  dayLabelEls.forEach((el, i) => el.classList.toggle('today', i === todayIdx));

  const list = document.getElementById('tasksList');
  list.innerHTML = '';

  state.tasks.forEach(task => {
    const days = getTaskDays(weekKey, task.id);
    const row = document.createElement('div');
    row.className = 'task-row';

    const nameEl = document.createElement('span');
    nameEl.className = 'task-name';
    nameEl.textContent = task.name;
    nameEl.title = 'Tap to edit';
    nameEl.onclick = () => startEditName(task.id, nameEl);
    row.appendChild(nameEl);

    for (let d = 0; d < 7; d++) {
      const btn = document.createElement('button');
      btn.className = 'circle-btn' + (days[d] ? ' done' : '') + (d === todayIdx ? ' today-col' : '');
      btn.setAttribute('aria-label', ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d]);
      btn.onclick = () => toggleDay(weekKey, task.id, d, btn);
      row.appendChild(btn);
    }

    const del = document.createElement('button');
    del.className = 'task-delete';
    del.innerHTML = '×';
    del.title = 'Remove habit';
    del.onclick = () => deleteTask(task.id);
    row.appendChild(del);

    list.appendChild(row);
  });
}

function startEditName(taskId, el) {
  const task = state.tasks.find(t => t.id === taskId);
  const input = document.createElement('input');
  input.className = 'task-name-input';
  input.value = task.name;
  el.replaceWith(input);
  input.focus(); input.select();
  const done = () => { task.name = input.value.trim() || task.name; saveState(); renderTracker(); };
  input.onblur = done;
  input.onkeydown = e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = task.name; input.blur(); } };
}

function toggleDay(weekKey, taskId, dayIndex, btn) {
  const days = getTaskDays(weekKey, taskId);
  days[dayIndex] = !days[dayIndex];
  btn.classList.toggle('done', days[dayIndex]);
  saveState();
}

function addTask() {
  const id = 't' + Date.now();
  state.tasks.push({ id, name: 'New habit' });
  saveState(); renderTracker();
  setTimeout(() => {
    const rows = document.querySelectorAll('.task-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('.task-name').click();
  }, 50);
}

function deleteTask(taskId) {
  if (!confirm('Remove this habit?')) return;
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  saveState(); renderTracker();
}

function changeWeek(dir) { currentWeekOffset += dir; renderTracker(); }

// ─── STATS ───────────────────────────────────────────────────────────────────
function renderStats() {
  const allWeekKeys = Object.keys(state.weeks).sort();
  let totalDone = 0;
  const taskTotals = {};
  state.tasks.forEach(t => { taskTotals[t.id] = { done: 0, total: 0 }; });

  allWeekKeys.forEach(wk => {
    state.tasks.forEach(t => {
      getTaskDays(wk, t.id).forEach(d => {
        taskTotals[t.id].total++;
        if (d) { taskTotals[t.id].done++; totalDone++; }
      });
    });
  });

  const totalPossible = state.tasks.length * 7 * allWeekKeys.length;
  const overallPct = totalPossible > 0 ? Math.round(totalDone / totalPossible * 100) : 0;

  let bestWeekPct = 0;
  allWeekKeys.forEach(wk => {
    let done = 0, tot = state.tasks.length * 7;
    state.tasks.forEach(t => { getTaskDays(wk, t.id).forEach(d => { if (d) done++; }); });
    const p = tot > 0 ? Math.round(done / tot * 100) : 0;
    if (p > bestWeekPct) bestWeekPct = p;
  });

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-number">${allWeekKeys.length}</div><div class="stat-label">Weeks tracked</div></div>
    <div class="stat-card"><div class="stat-number">${overallPct}%</div><div class="stat-label">Overall rate</div></div>
    <div class="stat-card"><div class="stat-number">${bestWeekPct}%</div><div class="stat-label">Best week</div></div>
  `;

  const taskSec = document.getElementById('taskStatsSection');
  if (state.tasks.length === 0 || allWeekKeys.length === 0) {
    taskSec.innerHTML = '<div class="empty-stats">No data yet — check off some habits to see stats.</div>';
  } else {
    taskSec.innerHTML = '';
    state.tasks.forEach(t => {
      const tt = taskTotals[t.id];
      const pct = tt.total > 0 ? Math.round(tt.done / tt.total * 100) : 0;
      const row = document.createElement('div');
      row.className = 'task-stat-row';
      row.innerHTML = `
        <span class="task-stat-name">${t.name}</span>
        <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        <span class="task-stat-count">${tt.done}/${tt.total} · ${pct}%</span>
      `;
      taskSec.appendChild(row);
    });
  }

  const histSec = document.getElementById('weekHistory');
  if (allWeekKeys.length === 0) {
    histSec.innerHTML = '<div class="empty-stats">No completed weeks yet.</div>';
  } else {
    histSec.innerHTML = '';
    [...allWeekKeys].reverse().slice(0, 12).forEach(wk => {
      let done = 0, total = 0;
      const dayDone = [0,0,0,0,0,0,0];
      state.tasks.forEach(t => {
        getTaskDays(wk, t.id).forEach((d, i) => { total++; if (d) { done++; dayDone[i]++; } });
      });
      const pct = total > 0 ? Math.round(done / total * 100) : 0;
      const start = new Date(wk);
      const label = start.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
      const row = document.createElement('div');
      row.className = 'week-hist-row';
      const dots = dayDone.map((n,i) => `<div class="hist-dot${n>0?' done':''}" title="${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}"></div>`).join('');
      row.innerHTML = `<span class="hist-week-label">${label}</span><div class="hist-dots">${dots}</div><span class="hist-pct">${pct}%</span>`;
      histSec.appendChild(row);
    });
  }
}

// ─── PAGE SWITCH ─────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'stats') renderStats();
}

// ─── PWA / INSTALL BANNER ────────────────────────────────────────────────────
function dismissInstall() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('installDismissed', '1');
}

// Show iOS install hint if in Safari and not installed
function maybeShowInstallBanner() {
  if (localStorage.getItem('installDismissed')) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone) {
    document.getElementById('installBanner').classList.add('show');
  }
}

// ─── SERVICE WORKER ──────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderTracker();
maybeShowInstallBanner();
</script>
</body>
</html>
