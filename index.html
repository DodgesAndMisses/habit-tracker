<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>◯ Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Special+Elite&family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ═══════════════════════════════════════
   BASE (NORMAL MODE)
═══════════════════════════════════════ */
:root {
  --bg:#0a0a0a; --surface:#111; --border:#222; --accent:#e63232; --accent-dim:#7a1a1a;
  --text:#f0f0f0; --text-dim:#555; --text-mid:#888; --done:#e63232;
  --empty:#1e1e1e; --empty-bd:#333;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ff:'Space Grotesk',sans-serif; --ff-mono:'Space Mono',monospace;
  --r:12px; --r-sm:8px; --r-circle:50%;
  --nav-bd:1px solid var(--border); --card-bd:1px solid var(--border); --circle-bw:2px;
  --nav-pad:12px 16px; --font-task:13px; --font-day:8px; --font-stat:26px;
}

html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--ff);min-height:100vh;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;transition:background 0.3s,color 0.3s;}

/* ═══════════════════════════════════════
   UNDERTALE MODE
═══════════════════════════════════════ */
body.mode-undertale {
  --bg:#000; --surface:#0d0d0d; --border:#333; --accent:#ff3333; --accent-dim:#990000;
  --text:#fff; --text-dim:#666; --text-mid:#aaa; --done:#ff3333;
  --empty:#111; --empty-bd:#444;
  --ff:'Press Start 2P',monospace; --ff-mono:'Press Start 2P',monospace;
  --r:0px; --r-sm:0px; --r-circle:0px;
  --nav-bd:3px solid #ff3333; --card-bd:3px solid #333; --circle-bw:3px;
  --font-task:7px; --font-day:6px; --font-stat:18px;
}
body.mode-undertale *{image-rendering:pixelated;}
body.mode-undertale .nav-logo{font-size:9px;}
body.mode-undertale .nav-logo::after{content:'█';animation:blink 1s steps(1) infinite;color:#ff3333;margin-left:3px;}
body.mode-undertale .nav-tab{font-size:6px;padding:7px 10px;}
body.mode-undertale .week-title,.mode-undertale .week-label{font-size:6px;}
body.mode-undertale .stat-label,.mode-undertale .section-label,.mode-undertale .task-stat-count,.mode-undertale .hist-week-label,.mode-undertale .hist-pct{font-size:6px;}
body.mode-undertale .task-stat-name{font-size:7px;}
body.mode-undertale .stats-title{font-size:7px;}
body.mode-undertale .add-task-btn{font-size:7px;border:3px dashed #444;}
body.mode-undertale .circle-btn.done{background:var(--done);box-shadow:inset -3px -3px 0 #880000,inset 3px 3px 0 #ff7777;border-color:#ff3333;}
body.mode-undertale .circle-btn:not(.done){box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #555;}
body.mode-undertale .task-row{box-shadow:3px 3px 0 #000;}
body.mode-undertale .stat-card{box-shadow:3px 3px 0 #000;border:3px solid #ff3333;}
body.mode-undertale .week-nav button{border:3px solid #444;box-shadow:2px 2px 0 #000;}
body.mode-undertale .week-nav button:active{box-shadow:none;transform:translate(2px,2px);}
body.mode-undertale #modeBtn{border:3px solid #ff3333;box-shadow:3px 3px 0 #000;}
body.mode-undertale #modeBtn:active{box-shadow:none;transform:translate(3px,3px);}
body.mode-undertale .progress-bar-wrap,.mode-undertale .hist-dot{border-radius:0;}
body.mode-undertale::after{content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);z-index:9000;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pixelPop{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(0.9)}100%{transform:scale(1)}}
body.mode-undertale .circle-btn.pop{animation:pixelPop 0.2s steps(4) forwards;}

/* ═══════════════════════════════════════
   PAPERS PLEASE MODE
═══════════════════════════════════════ */
body.mode-papers {
  --bg:#1a1710; --surface:#231f17; --border:#3d3428; --accent:#8b1a1a; --accent-dim:#5a1010;
  --text:#c8b89a; --text-dim:#5a4f3a; --text-mid:#8a7660; --done:#8b1a1a;
  --empty:#18150f; --empty-bd:#3d3428;
  --ff:'Special Elite',serif; --ff-mono:'Special Elite',serif;
  --r:0px; --r-sm:0px; --r-circle:0px;
  --nav-bd:2px solid #3d3428; --card-bd:2px solid #3d3428; --circle-bw:2px;
  --font-task:12px; --font-day:9px; --font-stat:22px;
}
body.mode-papers .nav-logo{color:#8b1a1a;letter-spacing:0.2em;font-size:11px;}
body.mode-papers .nav-logo::before{content:'☭ ';}
body.mode-papers .nav-tab{font-size:10px;letter-spacing:0.08em;}
body.mode-papers .nav-tab.active{background:#8b1a1a;color:#c8b89a;}
body.mode-papers .week-title{letter-spacing:0.15em;}
body.mode-papers .week-label,.mode-papers .week-title{font-size:10px;color:#8a7660;letter-spacing:0.05em;}
body.mode-papers .day-label{font-size:9px;color:#5a4f3a;letter-spacing:0.1em;}
body.mode-papers .task-row{border-left:4px solid #3d3428;}
body.mode-papers .task-row:nth-child(odd){background:#1e1b12;}
body.mode-papers .stat-card{border-top:3px solid #8b1a1a;border-left:none;border-right:none;border-bottom:1px solid #3d3428;border-radius:0;}
body.mode-papers .stat-number{color:#8b1a1a;}
body.mode-papers .stat-label{letter-spacing:0.15em;font-size:8px;}
body.mode-papers .section-label{color:#8b1a1a;letter-spacing:0.2em;border-bottom:1px solid #3d3428;padding-bottom:4px;}
body.mode-papers .circle-btn.done{background:#8b1a1a;border-color:#6b1414;}
body.mode-papers .circle-btn.done::after{display:none;}
body.mode-papers .add-task-btn{border:1px dashed #3d3428;color:#5a4f3a;}
body.mode-papers .progress-bar{background:#8b1a1a;}
body.mode-papers .hist-dot{border-radius:0;}
body.mode-papers .hist-dot.done{background:#8b1a1a;border-color:#6b1414;}
body.mode-papers .empty-stats{border:1px solid #3d3428;color:#5a4f3a;}
body.mode-papers #modeBtn{background:#1a1710;border:2px solid #3d3428;color:#8a7660;font-size:9px;letter-spacing:0.1em;}
body.mode-papers nav{border-bottom:2px solid #3d3428;}
body.mode-papers::before{content:'ARSTOTZKA — DAILY COMPLIANCE RECORD';position:fixed;top:0;left:0;right:0;
  font-family:'Special Elite',serif;font-size:7px;color:#3d3428;text-align:center;
  padding:2px;background:#141210;letter-spacing:0.3em;z-index:200;}
body.mode-papers nav{margin-top:16px;}

/* stamp effect on done circles */
body.mode-papers .circle-btn.done::before{content:'✓';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:#c8b89a;font-family:'Special Elite',serif;
  text-shadow:1px 1px 0 #5a1010;}
.mode-papers .circle-btn.done::after{display:none;}

/* ═══════════════════════════════════════
   TARKOV MODE
═══════════════════════════════════════ */
body.mode-tarkov {
  --bg:#0d110d; --surface:#111a11; --border:#1e2e1a; --accent:#4a7c3f; --accent-dim:#2a4a22;
  --text:#8aaa7a; --text-dim:#2e3e28; --text-mid:#5a7a4a; --done:#4a7c3f;
  --empty:#0a0f0a; --empty-bd:#1e2e1a;
  --ff:'Share Tech Mono',monospace; --ff-mono:'Share Tech Mono',monospace;
  --r:0px; --r-sm:0px; --r-circle:0px;
  --nav-bd:1px solid #1e2e1a; --card-bd:1px solid #1e2e1a; --circle-bw:1px;
  --font-task:11px; --font-day:8px; --font-stat:22px;
}
body.mode-tarkov .nav-logo{font-size:10px;color:#4a7c3f;letter-spacing:0.25em;text-transform:uppercase;}
body.mode-tarkov .nav-logo::before{content:'[SYS] ';color:#2e4e28;font-size:9px;}
body.mode-tarkov .nav-tab{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;}
body.mode-tarkov .nav-tab.active{background:#1e3018;color:#8aaa7a;border:1px solid #4a7c3f;}
body.mode-tarkov .nav-tabs{border:1px solid #1e2e1a;background:#0a0f0a;}
body.mode-tarkov .week-title{font-size:8px;letter-spacing:0.25em;color:#2e4e28;}
body.mode-tarkov .week-label{font-size:8px;letter-spacing:0.1em;}
body.mode-tarkov .day-label{font-size:7px;letter-spacing:0.15em;}

/* grid inventory feel on task rows */
body.mode-tarkov .task-row{
  border:1px solid #1e2e1a;
  border-left:3px solid #2e4e28;
  background:#0d110d;
  position:relative;
}
body.mode-tarkov .task-row::before{
  content:attr(data-idx);position:absolute;top:2px;right:38px;
  font-size:7px;color:#1e2e1a;letter-spacing:0.1em;font-family:'Share Tech Mono',monospace;
}

/* condition-bar style circles — square with inner fill like EFT item condition */
body.mode-tarkov .circle-btn{
  border:1px solid #2e4e28;background:#080c08;
  position:relative;overflow:hidden;
}
body.mode-tarkov .circle-btn::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:0%;
  background:#1e3018;transition:height 0.1s;
}
body.mode-tarkov .circle-btn.done{
  background:#0d1f0d;border-color:#4a7c3f;
}
body.mode-tarkov .circle-btn.done::before{height:100%;background:#1a3a18;}
body.mode-tarkov .circle-btn.done::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:#4a7c3f;
  font-family:'Share Tech Mono',monospace;background:transparent;
}
body.mode-tarkov .circle-btn:not(.done)::after{display:none;}

/* status readout strip above tasks */
body.mode-tarkov .day-labels::after{
  content:'STATUS: ACTIVE  |  PMC TRACKING ON';
  grid-column:1/-1;font-size:7px;color:#1e3018;letter-spacing:0.2em;
  font-family:'Share Tech Mono',monospace;padding-top:2px;
  border-top:1px solid #1a2818;
}

body.mode-tarkov .stat-card{
  border:1px solid #1e2e1a;border-top:2px solid #4a7c3f;
  background:#0a0f0a;border-radius:0;
}
body.mode-tarkov .stat-number{color:#4a7c3f;font-size:22px;}
body.mode-tarkov .stat-label{font-size:7px;letter-spacing:0.2em;color:#2e4e28;}
body.mode-tarkov .section-label{color:#2e4e28;letter-spacing:0.25em;border-bottom:1px solid #1e2e1a;padding-bottom:3px;}
body.mode-tarkov .task-stat-name{font-size:10px;letter-spacing:0.05em;}
body.mode-tarkov .task-stat-count{font-size:8px;color:#2e4e28;}
body.mode-tarkov .progress-bar-wrap{height:4px;border-radius:0;background:#080c08;border:1px solid #1a2818;}
body.mode-tarkov .progress-bar{background:#3a6a30;border-radius:0;}
body.mode-tarkov .hist-dot{border-radius:0;width:14px;height:14px;border:1px solid #1e2e1a;}
body.mode-tarkov .hist-dot.done{background:#2a4a22;border-color:#4a7c3f;}
body.mode-tarkov .hist-week-label{font-size:7px;letter-spacing:0.1em;min-width:58px;}
body.mode-tarkov .hist-pct{font-size:8px;}
body.mode-tarkov .add-task-btn{border:1px solid #1e2e1a;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#2e4e28;}
body.mode-tarkov .empty-stats{border:1px solid #1e2e1a;font-size:9px;letter-spacing:0.1em;color:#2e4e28;}
body.mode-tarkov #modeBtn{border:1px solid #1e2e1a;color:#2e4e28;font-size:8px;letter-spacing:0.15em;}
body.mode-tarkov .task-delete{color:#2e4e28;}

/* intel ticker at top */
body.mode-tarkov::before{
  content:'// BSG SECURE CHANNEL  //  NORVINSK REGION  //  CONNECTION STABLE //';
  position:fixed;top:0;left:0;right:0;overflow:hidden;white-space:nowrap;
  font-family:'Share Tech Mono',monospace;font-size:7px;color:#1e3018;
  background:#080c08;padding:3px 8px;letter-spacing:0.15em;z-index:200;
  border-bottom:1px solid #1a2818;
}
body.mode-tarkov nav{margin-top:17px;}

/* green flash on circle check */
@keyframes tarkovFlash{0%{background:#3a6a30}50%{background:#5aaa4a}100%{background:#1a3a18}}
body.mode-tarkov .circle-btn.done{animation:tarkovFlash 0.25s ease-out;}

/* NVG scanline — very subtle green noise */
body.mode-tarkov::after{content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(60,120,40,0.03) 3px,rgba(60,120,40,0.03) 4px);
  z-index:9000;}

/* ═══════════════════════════════════════
   GENSHIN IMPACT MODE
   Reference: warm dark brown-gray bg, translucent cream panels,
   gold filigree borders, Paimon blue accent, warm cream text
═══════════════════════════════════════ */
body.mode-genshin {
  --bg:#1c1510; --surface:#2a1f14; --border:#c9a84c55; --accent:#c9a84c; --accent-dim:#7a6020;
  --text:#ede5c8; --text-dim:#7a6a50; --text-mid:#b09a70; --done:#c9a84c;
  --empty:#160f08; --empty-bd:#3a2a18;
  --ff:'Cinzel',serif; --ff-mono:'Cinzel',serif;
  --r:6px; --r-sm:4px; --r-circle:50%;
  --nav-bd:1px solid #c9a84c44; --card-bd:1px solid #c9a84c44; --circle-bw:2px;
  --font-task:12px; --font-day:9px; --font-stat:24px;
}

/* warm parchment header */
body.mode-genshin::before{
  content:'✦  Daily Commissions  ✦';
  position:fixed;top:0;left:0;right:0;
  font-family:'Cinzel',serif;font-size:8px;color:#c9a84c99;text-align:center;
  padding:4px 8px;background:#130e08;letter-spacing:0.25em;z-index:200;
  border-bottom:1px solid #c9a84c33;
}
body.mode-genshin nav{margin-top:20px;background:#1c1510;border-bottom:1px solid #c9a84c33;}

/* logo — warm gold, Cinzel Decorative */
body.mode-genshin .nav-logo{
  font-family:'Cinzel Decorative',serif;font-size:10px;color:#c9a84c;
  letter-spacing:0.1em;text-transform:none;
}

/* nav tabs — warm brown bg, gold active */
body.mode-genshin .nav-tabs{background:#130e08;border:1px solid #c9a84c33;border-radius:4px;}
body.mode-genshin .nav-tab{font-size:10px;letter-spacing:0.06em;color:#7a6a50;border-radius:4px;}
body.mode-genshin .nav-tab.active{
  background:#2a1e0e;color:#c9a84c;border:1px solid #c9a84c66;
}

/* week nav */
body.mode-genshin .week-title{font-size:8px;letter-spacing:0.18em;color:#7a6a50;}
body.mode-genshin .week-label{font-size:9px;color:#b09a70;}
body.mode-genshin .week-nav button{border:1px solid #c9a84c44;background:#130e08;color:#c9a84c;border-radius:4px;}
body.mode-genshin .day-label{font-size:8px;letter-spacing:0.1em;color:#7a6a50;}
body.mode-genshin .day-label.today{color:#c9a84c;}

/* task rows — translucent warm panel with gold filigree border */
body.mode-genshin .task-row{
  background:#231a0e;
  border:1px solid #c9a84c44;
  border-radius:6px;
  position:relative;
}
/* gold corner ornament top-left */
body.mode-genshin .task-row::before{
  content:'❖';position:absolute;top:2px;left:6px;
  color:#c9a84c55;font-size:8px;line-height:1;
}

/* circles — warm empty, gold filled like resin/stamina */
body.mode-genshin .circle-btn{
  border:2px solid #3a2a18;background:#160f08;
}
body.mode-genshin .circle-btn.done{
  background:#2a1e08;border-color:#c9a84c;
  box-shadow:0 0 8px #c9a84c55;
}
body.mode-genshin .circle-btn.done::after{
  content:'✦';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:#c9a84c;background:transparent;
  border-radius:50%;
}

/* stat cards — parchment panel style with gold top rule */
body.mode-genshin .stat-card{
  background:#231a0e;border:1px solid #c9a84c44;border-top:2px solid #c9a84c;
  border-radius:6px;
}
body.mode-genshin .stat-number{color:#c9a84c;font-family:'Cinzel',serif;}
body.mode-genshin .stat-label{font-size:8px;letter-spacing:0.12em;color:#7a6a50;}

/* section labels — gold with Genshin-style trailing rule */
body.mode-genshin .section-label{
  color:#c9a84c;letter-spacing:0.18em;font-size:8px;
  display:flex;align-items:center;gap:8px;
}
body.mode-genshin .section-label::before{content:'❖';font-size:8px;color:#c9a84c88;}
body.mode-genshin .section-label::after{content:'';flex:1;height:1px;background:#c9a84c33;}

body.mode-genshin .task-stat-name{font-size:11px;color:#ede5c8;}
body.mode-genshin .task-stat-count{font-size:8px;color:#7a6a50;}
body.mode-genshin .progress-bar-wrap{height:5px;border-radius:3px;background:#160f08;border:1px solid #3a2a18;}
body.mode-genshin .progress-bar{background:linear-gradient(90deg,#8a6820,#c9a84c);border-radius:3px;}
body.mode-genshin .hist-dot{border-radius:50%;background:#160f08;border:1.5px solid #3a2a18;}
body.mode-genshin .hist-dot.done{background:#2a1e08;border-color:#c9a84c;box-shadow:0 0 4px #c9a84c55;}
body.mode-genshin .hist-week-label{font-size:8px;color:#7a6a50;}
body.mode-genshin .hist-pct{font-size:8px;color:#b09a70;}
body.mode-genshin .week-hist-row{background:#231a0e;border:1px solid #c9a84c33;border-radius:6px;}
body.mode-genshin .task-stat-row{background:#231a0e;border:1px solid #c9a84c33;border-radius:6px;}
body.mode-genshin .add-task-btn{border:1px dashed #c9a84c44;color:#7a6a50;font-size:11px;border-radius:6px;}
body.mode-genshin .add-task-btn:active{border-color:#c9a84c;color:#c9a84c;}
body.mode-genshin .empty-stats{border:1px solid #c9a84c33;color:#7a6a50;font-size:10px;border-radius:6px;}
body.mode-genshin #modeBtn{background:#130e08;border:1px solid #c9a84c33;color:#7a6a50;font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.1em;border-radius:4px;}
body.mode-genshin .task-delete{color:#3a2a18;}
body.mode-genshin .stats-title{color:#c9a84c;}

/* gold shimmer on commission complete */
@keyframes genshinPulse{
  0%{box-shadow:0 0 0 #c9a84b00}
  30%{box-shadow:0 0 14px #c9a84baa}
  100%{box-shadow:0 0 5px #c9a84b44}
}
body.mode-genshin .circle-btn.done{animation:genshinPulse 0.5s ease-out;}

/* warm ambient vignette — like Genshin's panel glow */
body.mode-genshin::after{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,#c9a84c08 0%,transparent 60%),
    radial-gradient(ellipse at 50% 100%,#c9a84c06 0%,transparent 50%);
  z-index:9000;}

/* ═══════════════════════════════════════
   POKÉMON MODE
   Reference: Gen 1/2 battle UI — gray bg,
   thick black rounded dialog boxes, GB mono font,
   HP bars, Pokéball party circles
═══════════════════════════════════════ */
body.mode-pokemon {
  --bg:#8a9080; --surface:#d8d8c8; --border:#181818; --accent:#e83030; --accent-dim:#900000;
  --text:#181818; --text-dim:#585850; --text-mid:#383830; --done:#e83030;
  --empty:#b8b8a8; --empty-bd:#181818;
  --ff:'Press Start 2P',monospace; --ff-mono:'Press Start 2P',monospace;
  --r:12px; --r-sm:8px; --r-circle:50%;
  --nav-bd:4px solid #181818; --card-bd:4px solid #181818; --circle-bw:3px;
  --font-task:7px; --font-day:6px; --font-stat:16px;
}
body.mode-pokemon *{image-rendering:pixelated;}

/* gray battlefield background */
body.mode-pokemon{background:#8a9080;}

/* dialog box nav — white box with thick black border like battle menu */
body.mode-pokemon nav{
  background:#d8d8c8;
  border-bottom:4px solid #181818;
  padding:10px 14px;
}
body.mode-pokemon .nav-logo{
  font-size:8px;color:#181818;letter-spacing:0.05em;text-transform:uppercase;
}
body.mode-pokemon .nav-logo::before{content:'★ ';}
body.mode-pokemon .nav-tabs{
  background:#d8d8c8;border:4px solid #181818;border-radius:8px;padding:3px;gap:2px;
}
body.mode-pokemon .nav-tab{
  font-size:6px;padding:6px 10px;color:#585850;border-radius:6px;

  undertale:{logo:'* tracker',title:'* WEEKLY UNDERTAKINGS',add:'* New Determination',statsTitle:'* YOUR STATS',byHabit:'* BY SOUL',weekHist:'* PAST WEEKS'},
  papers:{logo:'ARSTOTZKA — HABIT COMPLIANCE',title:'DAILY COMPLIANCE LOG',add:'+ ADD ENTRY TO RECORD',statsTitle:'COMPLIANCE STATISTICS',byHabit:'PER-ACTIVITY RATE',weekHist:'WEEKLY RECORDS'},
  tarkov:{logo:'TASK TRACKER',title:'WEEKLY OBJECTIVES',add:'+ ADD OBJECTIVE',statsTitle:'PERFORMANCE LOG',byHabit:'BY OBJECTIVE',weekHist:'RAID HISTORY'},
  genshin:{logo:'Daily Commissions',title:'Weekly Commissions',add:'＋ Add Commission',statsTitle:'Adventure Rank Log',byHabit:'By Commission',weekHist:'Past Expeditions'},
  pokemon:{logo:'HABIT DEX',title:'WEEKLY BATTLE',add:'► NEW HABIT',statsTitle:'TRAINER RECORD',byHabit:'BY HABIT',weekHist:'PAST WEEKS'},
  ac:{logo:'Habit Island',title:'Today\'s Tasks',add:'+ Plant new habit',statsTitle:'Island Report',byHabit:'By Habit',weekHist:'Past Weeks'},
  stardew:{logo:'Stardew Farm',title:'Farm Journal',add:'+ Plant new habit',statsTitle:'Farm Stats',byHabit:'By Crop',weekHist:'Past Seasons'},
  sims:{logo:'◆ My Sims',title:'Weekly Needs',add:'+ Add want',statsTitle:'Mood Report',byHabit:'By Need',weekHist:'Past Weeks'},
};
applyMode(false);

function applyMode(animate){
  document.body.className='mode-'+currentMode;
  localStorage.setItem('trackerMode',currentMode);
  const m=MODES[currentMode];
  document.getElementById('logoText').textContent=m.logo;
  document.getElementById('weekTitle').textContent=m.title;
  document.getElementById('addLabel').textContent=m.add;
  document.getElementById('statsTitle').textContent=m.statsTitle;
  document.getElementById('byHabitLabel').textContent=m.byHabit;
  document.getElementById('weekHistLabel').textContent=m.weekHist;
  document.getElementById('modeBtn').textContent=
    currentMode==='normal'?'STYLE':currentMode==='undertale'?'MODE':currentMode==='papers'?'STYLE':'[STYLE]';
  document.querySelectorAll('.mode-icon').forEach(o=>o.classList.remove('selected'));
  const sel=document.getElementById('opt-'+currentMode);
  if(sel) sel.classList.add('selected');
  if(animate){
    if(currentMode==='undertale'){
      document.body.style.filter='brightness(0)';
      setTimeout(()=>{document.body.style.filter='brightness(0.3)';},80);
      setTimeout(()=>{document.body.style.filter='brightness(0.7)';},160);
      setTimeout(()=>{document.body.style.filter='';},260);
    } else if(currentMode==='papers'){
      document.body.style.filter='sepia(1)';
      setTimeout(()=>{document.body.style.filter='';},400);
    } else if(currentMode==='tarkov'){
      document.body.style.filter='saturate(0) brightness(0.3)';
      setTimeout(()=>{document.body.style.filter='saturate(0.5) brightness(0.7) hue-rotate(80deg)';},100);
      setTimeout(()=>{document.body.style.filter='';},350);
    } else if(currentMode==='genshin'){
      document.body.style.filter='brightness(0.2) saturate(3) hue-rotate(200deg)';
      setTimeout(()=>{document.body.style.filter='brightness(0.6) saturate(2)';},120);
      setTimeout(()=>{document.body.style.filter='';},320);
    } else if(currentMode==='pokemon'){
      document.body.style.filter='brightness(5)';
      setTimeout(()=>{document.body.style.filter='brightness(1)';},80);
      setTimeout(()=>{document.body.style.filter='brightness(5)';},160);
      setTimeout(()=>{document.body.style.filter='';},280);
    } else if(currentMode==='ac'){
      document.body.style.filter='brightness(1.8) saturate(2) hue-rotate(30deg)';
      setTimeout(()=>{document.body.style.filter='brightness(1.3)';},150);
      setTimeout(()=>{document.body.style.filter='';},350);
    } else if(currentMode==='stardew'){
      document.body.style.filter='sepia(1) brightness(0.4)';
      setTimeout(()=>{document.body.style.filter='sepia(0.5) brightness(0.8)';},120);
      setTimeout(()=>{document.body.style.filter='';},300);
    } else if(currentMode==='sims'){
      document.body.style.filter='brightness(1.5) hue-rotate(150deg)';
      setTimeout(()=>{document.body.style.filter='brightness(1.2)';},130);
      setTimeout(()=>{document.body.style.filter='';},300);
    }
  }
  renderTracker();
}

// ─── FONT SIZE ────────────────────────────────────────────────────────────────
let fontScale=parseInt(localStorage.getItem('fontScale')||'100');
function applyFontScale(scale){
  fontScale=scale;
  document.body.style.zoom=scale+'%';
  localStorage.setItem('fontScale',scale);
  const p=document.getElementById('fontPreview');
  if(p) p.textContent='Habit tracker ('+scale+'%)';
}
applyFontScale(fontScale);

function initFontSlider(){
  const s=document.getElementById('fontSlider');
  if(!s) return;
  s.value=fontScale;
  const p=document.getElementById('fontPreview');
  if(p) p.textContent='Habit tracker ('+fontScale+'%)';
  s.oninput=()=>applyFontScale(parseInt(s.value));
}

function openPicker(){
  document.getElementById('modePicker').classList.add('show');
  initFontSlider();
}
function closePicker(){document.getElementById('modePicker').classList.remove('show');}
function setMode(m){
  currentMode=m;
  applyMode(true);
  document.querySelectorAll('.mode-icon').forEach(o=>o.classList.remove('selected'));
  const sel=document.getElementById('opt-'+m);if(sel)sel.classList.add('selected');
}

function getWeekKey(offset=0){
  const now=new Date(),monday=new Date(now);
  monday.setDate(now.getDate()-((now.getDay()+6)%7)+offset*7);
  return monday.toISOString().slice(0,10);
}
function getWeekLabel(offset=0){
  const key=getWeekKey(offset),start=new Date(key),end=new Date(key);
  end.setDate(end.getDate()+6);
  const fmt=d=>d.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
  return`${fmt(start)} – ${fmt(end)}`;
}
function getWeekData(wk){if(!state.weeks[wk])state.weeks[wk]={};return state.weeks[wk];}
function getTaskDays(wk,id){const w=getWeekData(wk);if(!w[id])w[id]=[false,false,false,false,false,false,false];return w[id];}
function todayDayIndex(){return(new Date().getDay()+6)%7;}

function renderTracker(){
  const weekKey=getWeekKey(currentWeekOffset);
  document.getElementById('weekLabel').textContent=getWeekLabel(currentWeekOffset);
  const todayIdx=currentWeekOffset===0?todayDayIndex():-1;
  document.querySelectorAll('#dayLabels .day-label').forEach((el,i)=>el.classList.toggle('today',i===todayIdx));
  const list=document.getElementById('tasksList');
  list.innerHTML='';
  state.tasks.forEach(task=>{
    const days=getTaskDays(weekKey,task.id);
    const row=document.createElement('div'); row.className='task-row';
    const nameEl=document.createElement('span'); nameEl.className='task-name';
    nameEl.textContent=task.name; nameEl.onclick=()=>startEditName(task.id,nameEl);
    row.appendChild(nameEl);
    for(let d=0;d<7;d++){
      const btn=document.createElement('button'); btn.className='circle-btn'+(days[d]?' done':'');
      btn.onclick=()=>toggleDay(weekKey,task.id,d,btn);
      row.appendChild(btn);
    }
    const del=document.createElement('button'); del.className='task-delete'; del.innerHTML='×';
    del.onclick=()=>deleteTask(task.id);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function startEditName(taskId,el){
  const task=state.tasks.find(t=>t.id===taskId);
  const input=document.createElement('input'); input.className='task-name-input'; input.value=task.name;
  el.replaceWith(input); input.focus(); input.select();
  const done=()=>{task.name=input.value.trim()||task.name;saveState();renderTracker();};
  input.onblur=done;
  input.onkeydown=e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=task.name;input.blur();}};
}
function toggleDay(weekKey,taskId,dayIndex,btn){
  const days=getTaskDays(weekKey,taskId);
  days[dayIndex]=!days[dayIndex];
  btn.classList.toggle('done',days[dayIndex]);
  if(currentMode==='undertale'&&days[dayIndex]){
    btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),300);
  }
  if(currentMode==='pokemon'&&days[dayIndex]){
    btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),400);
  }
  if(currentMode==='ac'&&days[dayIndex]){
    btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),400);
  }
  if(currentMode==='stardew'&&days[dayIndex]){
    btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),250);
  }
  if(currentMode==='sims'&&days[dayIndex]){
    btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),300);
  }
  saveState();
}
function addTask(){
  const id='t'+Date.now(); state.tasks.push({id,name:'New habit'});
  saveState(); renderTracker();
  setTimeout(()=>{const rows=document.querySelectorAll('.task-row');const last=rows[rows.length-1];if(last)last.querySelector('.task-name').click();},50);
}
function deleteTask(taskId){
  const msgs={normal:'Remove this habit?',undertale:'* Are you sure?\n\nYou want to give up?',papers:'CONFIRM REMOVAL OF ENTRY FROM RECORD',tarkov:'[SYSTEM] Objective abort confirmed?\nProgress will not be recovered.',genshin:'Abandon this commission?\nThe Adventurers\' Guild will not be pleased.',pokemon:'HABIT fled!\n\nReally give up?',ac:'Are you sure? 🍃\nTom Nook will be disappointed...',stardew:'Uproot this habit?\nThe crops won\'t water themselves.',sims:'Are you sure?\nYour Sim\'s needs will suffer.'};
  if(!confirm(msgs[currentMode]||msgs.normal))return;
  state.tasks=state.tasks.filter(t=>t.id!==taskId); saveState(); renderTracker();
}
function changeWeek(dir){currentWeekOffset+=dir;renderTracker();}

function renderStats(){
  const allWeekKeys=Object.keys(state.weeks).sort();
  let totalDone=0; const taskTotals={};
  state.tasks.forEach(t=>{taskTotals[t.id]={done:0,total:0};});
  allWeekKeys.forEach(wk=>{state.tasks.forEach(t=>{getTaskDays(wk,t.id).forEach(d=>{taskTotals[t.id].total++;if(d){taskTotals[t.id].done++;totalDone++;}});});});
  const tot=state.tasks.length*7*allWeekKeys.length;
  const pct=tot>0?Math.round(totalDone/tot*100):0;
  let best=0;
  allWeekKeys.forEach(wk=>{let d=0,t=state.tasks.length*7;state.tasks.forEach(tk=>{getTaskDays(wk,tk.id).forEach(v=>{if(v)d++;});});const p=t>0?Math.round(d/t*100):0;if(p>best)best=p;});
  const wLabel=currentMode==='papers'?'WEEKS':currentMode==='undertale'?'WEEKS':currentMode==='tarkov'?'RAIDS':currentMode==='genshin'?'Expeditions':currentMode==='pokemon'?'WEEKS':currentMode==='ac'?'Seasons':currentMode==='stardew'?'Seasons':currentMode==='sims'?'Weeks':'Weeks';
  const rLabel=currentMode==='papers'?'COMPLIANCE':currentMode==='undertale'?'LOVE':currentMode==='tarkov'?'EFFICIENCY':currentMode==='genshin'?'Devotion':currentMode==='pokemon'?'WIN RATE':currentMode==='ac'?'Happiness':currentMode==='stardew'?'Harvest':currentMode==='sims'?'Mood':'Rate';
  const bLabel=currentMode==='papers'?'BEST WEEK':currentMode==='undertale'?'BEST WEEK':currentMode==='tarkov'?'BEST RAID':currentMode==='genshin'?'Best Week':currentMode==='pokemon'?'BEST WEEK':currentMode==='ac'?'Best Week':currentMode==='stardew'?'Best Season':currentMode==='sims'?'Best Week':'Best';
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-number">${allWeekKeys.length}</div><div class="stat-label">${wLabel}</div></div>
    <div class="stat-card"><div class="stat-number">${pct}%</div><div class="stat-label">${rLabel}</div></div>
    <div class="stat-card"><div class="stat-number">${best}%</div><div class="stat-label">${bLabel}</div></div>`;
  const taskSec=document.getElementById('taskStatsSection');
  if(!state.tasks.length||!allWeekKeys.length){taskSec.innerHTML='<div class="empty-stats">No data yet.</div>';}
  else{
    taskSec.innerHTML='';
    state.tasks.forEach(t=>{
      const tt=taskTotals[t.id],p=tt.total>0?Math.round(tt.done/tt.total*100):0;
      const row=document.createElement('div'); row.className='task-stat-row';
      row.innerHTML=`<span class="task-stat-name">${t.name}</span><div class="progress-bar-wrap"><div class="progress-bar" style="width:${p}%"></div></div><span class="task-stat-count">${tt.done}/${tt.total}·${p}%</span>`;
      taskSec.appendChild(row);
    });
  }
  const histSec=document.getElementById('weekHistory');
  if(!allWeekKeys.length){histSec.innerHTML='<div class="empty-stats">No weeks yet.</div>';}
  else{
    histSec.innerHTML='';
    [...allWeekKeys].reverse().slice(0,12).forEach(wk=>{
      let done=0,total=0; const dd=[0,0,0,0,0,0,0];
      state.tasks.forEach(t=>{getTaskDays(wk,t.id).forEach((v,i)=>{total++;if(v){done++;dd[i]++;}});});
      const p=total>0?Math.round(done/total*100):0;
      const label=new Date(wk).toLocaleDateString('en-GB',{month:'short',day:'numeric'});
      const row=document.createElement('div'); row.className='week-hist-row';
      const dots=dd.map(n=>`<div class="hist-dot${n>0?' done':''}"></div>`).join('');
      row.innerHTML=`<span class="hist-week-label">${label}</span><div class="hist-dots">${dots}</div><span class="hist-pct">${p}%</span>`;
      histSec.appendChild(row);
    });
  }
}

function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='stats')renderStats();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e));}
renderTracker();
</script>
